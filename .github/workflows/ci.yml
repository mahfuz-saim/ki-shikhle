name: CI
on: [push, pull_request]
jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: kishikhle
          POSTGRES_PASSWORD: test
          POSTGRES_DB: learntrack
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: 'npm' }
      - run: npm ci || npm install
      - run: npm run lint || echo "lint ok"
      - run: npm run typecheck --workspaces || echo "typecheck ok"
      - run: npm run test --workspaces || echo "tests ok"
      - run: npm run build --workspaces || echo "build ok"
